[tool:pytest]
DJANGO_SETTINGS_MODULE = crm_erp.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
testpaths = 
    tests
    customers/tests
    products/tests
    invoices/tests
    core/tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests